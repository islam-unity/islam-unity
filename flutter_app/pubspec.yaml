name: ettehad_app
description: "سامانه معارفی، قرآن‌پژوهی و کتابخوان هوشمند اتحاد (نسخه نیتیو Flutter)"
publish_to: 'none'
version: 2.0.0+2

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.6
  flutter_markdown: ^0.7.7+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/data/quran_complete.json
    - assets/data/ettehad_offline_db.json
    - assets/data/ettehad.db
    - assets/images/logo_symbol_color.png
    - assets/images/logo_symbol_color_hd.png
    - assets/images/logo_symbol_white.png
    - assets/images/logo_lockup.png
    - assets/images/logo_horizontal.png
    - assets/images/app_icon.png
    - assets/images/covers/

  fonts:
    - family: Vazirmatn
      fonts:
        - asset: assets/fonts/Vazirmatn-Regular.ttf
          weight: 400
        - asset: assets/fonts/Vazirmatn-Medium.ttf
          weight: 500
        - asset: assets/fonts/Vazirmatn-Bold.ttf
          weight: 700
        - asset: assets/fonts/Vazirmatn-ExtraBold.ttf
          weight: 800
    - family: UthmanicHafs
      fonts:
        - asset: assets/fonts/UthmanicHafs.ttf
